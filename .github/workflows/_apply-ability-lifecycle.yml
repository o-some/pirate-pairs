name: Apply ability lifecycle patch

on:
  push:
    branches: [fix/boss-ability-lifecycle-help]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[ability-lifecycle-final]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/boss-ability-lifecycle-help
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply final lifecycle corrections
        run: node scripts/_finish_ability_lifecycle_patch.mjs
      - name: Validate final sources
        run: |
          node --check public/pirate-pairs-b04.js
          node tests/art-registry.mjs
          node tests/ability-lifecycle.mjs
      - name: Commit final sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/pirate-pairs-b04.js tests/ability-lifecycle.mjs
          git diff --cached --quiet && exit 0
          git commit -m "Harden persistent boss abilities and help safety [ability-lifecycle-final]"
          git push origin HEAD:fix/boss-ability-lifecycle-help
