name: Apply deterministic Roderick browser test fix

on:
  push:
    branches: [fix/boss-ability-lifecycle-help]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[roderick-browser-test-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/boss-ability-lifecycle-help
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch Roderick browser test
        run: node scripts/_fix_roderick_browser_test.mjs
      - name: Validate source contracts
        run: |
          node --check public/pirate-pairs-b04.js
          node tests/art-registry.mjs
          node tests/ability-lifecycle.mjs
      - name: Commit test correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/ability-lifecycle-browser.mjs
          git diff --cached --quiet && exit 0
          git commit -m "Make Roderick browser lifecycle test deterministic [roderick-browser-test-fixed]"
          git push origin HEAD:fix/boss-ability-lifecycle-help
