name: Build and deploy Astro to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Setup Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  b09-visual-smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Check B07 prep and B09 script syntax
        run: |
          node --check public/pirate-pairs-b07-prep.js
          node --check public/pirate-pairs-b09.js

      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit

      - name: Build
        run: npm run build

      - name: Start preview
        run: |
          npm run preview > /tmp/pirate-pairs-preview.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://localhost:4321/pirate-pairs/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/pirate-pairs-preview.log
          exit 1

      - name: Run B09 visual smoke
        run: npm run test:b09

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
